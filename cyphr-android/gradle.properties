org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Ustawienia aplikacji: zmien te dwie wartosci na swoje ----
# Adres backendu, bez ukosnika na koncu
cyphr.baseUrl=https://billing.cyphr.com.pl
# Client ID typu "Aplikacja internetowa" (Web) - ten sam, ktory masz w .env serwera
# jako GOOGLE_CLIENT_ID. NIE wpisuj tu identyfikatora klienta typu Android (tego
# z pakietem i SHA-1, u nas 601323249162-hmcc6q...): Google odrzuca wtedy kazde
# logowanie kodem 10. Klient Android musi tylko istniec w tym samym projekcie.
cyphr.googleWebClientId=601323249162-ugg3ejqfnp90tp94eq70m6m8dt5lpo9d.apps.googleusercontent.com
