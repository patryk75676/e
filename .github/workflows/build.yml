name: Build APK

# Projekt Androida lezy w podkatalogu cyphr-android/, dlatego wszystkie
# kroki uruchamiane sa w tym katalogu. Workflow MUSI byc w .github/workflows
# w korzeniu repozytorium — inaczej GitHub Actions go nie widzi.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyphr-android
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Domyslnie akcja instaluje przestarzaly pakiet "tools", ktorego juz
          # nie ma w repozytorium SDK — to wywalalo caly krok. Nic nie instalujemy
          # tutaj, potrzebne pakiety dokladamy nizej wlasnym sdkmanagerem.
          packages: ''

      - name: Zainstaluj platforme i build-tools
        working-directory: ${{ github.workspace }}
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Podloz staly klucz debugowy (jesli ustawiono sekret)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/debug.keystore
            echo "Uzywam klucza z sekretu DEBUG_KEYSTORE_B64."
          else
            echo "Brak sekretu DEBUG_KEYSTORE_B64 — buduje domyslnym kluczem debugowym."
          fi

      - name: Testy i APK (debug)
        # Najpierw testy jednostkowe — gdy ktorys padnie, APK nie wychodzi.
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Raport testow (tylko przy bledzie)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: raport-testow
          path: cyphr-android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Odcisk klucza do Google Cloud Console
        # Krok informacyjny — nie moze wywalic builda, gdy APK juz powstal.
        if: ${{ always() }}
        run: |
          KS="app/debug.keystore"
          [ -f "$KS" ] || KS="$HOME/.android/debug.keystore"
          echo "Nazwa pakietu: pl.cyphr.app" > fingerprint.txt
          if [ -f "$KS" ]; then
            keytool -list -v -keystore "$KS" -alias androiddebugkey \
              -storepass android -keypass android 2>/dev/null \
              | grep -E "SHA1:|SHA256:" >> fingerprint.txt \
              || echo "(nie udalo sie odczytac odcisku z $KS)" >> fingerprint.txt
          else
            echo "(brak pliku keystore — APK podpisany domyslnym kluczem debugowym runnera)" >> fingerprint.txt
          fi
          cat fingerprint.txt

      - name: Wyslij APK jako artefakt
        # Tylko gdy testy i budowa przeszly. Krok z odciskiem wyzej nie moze juz
        # wywalic joba, wiec nie trzeba go tu obchodzic.
        uses: actions/upload-artifact@v4
        with:
          name: cyphr-apk
          path: |
            cyphr-android/app/build/outputs/apk/debug/app-debug.apk
            cyphr-android/fingerprint.txt
          if-no-files-found: error
