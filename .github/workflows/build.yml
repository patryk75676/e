name: Build APK

# Projekt Androida lezy w podkatalogu cyphr-android/, dlatego wszystkie
# kroki uruchamiane sa w tym katalogu. Workflow MUSI byc w .github/workflows
# w korzeniu repozytorium — inaczej GitHub Actions go nie widzi.

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyphr-android
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Domyslnie akcja instaluje przestarzaly pakiet "tools", ktorego juz
          # nie ma w repozytorium SDK — to wywalalo caly krok. Nic nie instalujemy
          # tutaj, potrzebne pakiety dokladamy nizej wlasnym sdkmanagerem.
          packages: ''

      - name: Zainstaluj platforme i build-tools
        working-directory: ${{ github.workspace }}
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Podloz staly klucz debugowy (jesli ustawiono sekret)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > app/debug.keystore
            echo "Uzywam klucza z sekretu DEBUG_KEYSTORE_B64."
          else
            echo "Brak sekretu DEBUG_KEYSTORE_B64 — buduje domyslnym kluczem debugowym."
          fi

      - name: Zbuduj APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Odcisk klucza do Google Cloud Console
        run: |
          if [ -f app/debug.keystore ]; then
            KEYSTORE="app/debug.keystore"
          else
            KEYSTORE="$HOME/.android/debug.keystore"
          fi
          {
            echo "Nazwa pakietu: pl.cyphr.app"
            keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey \
              -storepass android -keypass android | grep -E "SHA1:|SHA256:"
          } > fingerprint.txt
          cat fingerprint.txt

      - name: Wyslij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: cyphr-apk
          path: |
            cyphr-android/app/build/outputs/apk/debug/app-debug.apk
            cyphr-android/fingerprint.txt
          if-no-files-found: error
