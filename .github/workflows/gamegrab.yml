name: GameGrab build

on:
  push:
    branches: [ "**" ]
    paths:
      - "gamegrab/**"
      - ".github/workflows/gamegrab.yml"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "gamegrab/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: gamegrab

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore .\GameGrab.sln

      - name: Publish single-file exe
        run: |
          dotnet publish .\src\GameGrab\GameGrab.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o bin\publish

      - name: Portable zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path bin\publish\GameGrab.exe,README.md `
            -DestinationPath dist\GameGrab-portable-x64.zip -Force

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameGrab-windows-x64
          path: |
            gamegrab/bin/publish/GameGrab.exe
            gamegrab/dist/GameGrab-Setup.exe
            gamegrab/dist/GameGrab-portable-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gamegrab/bin/publish/GameGrab.exe
            gamegrab/dist/GameGrab-Setup.exe
            gamegrab/dist/GameGrab-portable-x64.zip
          generate_release_notes: true
